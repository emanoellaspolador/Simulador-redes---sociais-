<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Redes Sociais</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f2f5;margin:0;padding:20px}
.container{max-width:500px;margin:auto;background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
h1{text-align:center;color:#1877f2}
textarea{width:100%;height:80px;border-radius:8px;padding:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:#1877f2;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-top:10px;width:100%;font-size:16px}
.post{background:#f0f2f5;padding:12px;border-radius:10px;margin-top:15px}
.post b{color:#111}
.actions{margin-top:8px;display:flex;gap:10px}
.actions button{background:white;color:#333;border:1px solid #ddd;padding:6px 10px;width:auto;font-size:14px}
</style>
</head>
<body>
<div class="container">
<h1>Simulador de Redes Sociais</h1>
<p>O que você está pensando?</p>
<textarea id="texto" placeholder="Escreva sua postagem aqui..."></textarea>
<button onclick="postar()">Publicar</button>
<div id="feed"></div>
</div>
<script>
let curtidas = {};
function postar(){
  let texto = document.getElementById('texto').value;
  if(texto.trim() === ''){ alert('Escreva algo!'); return; }
  let id = Date.now();
  curtidas[id] = 0;
  let div = document.createElement('div');
  div.className = 'post';
  div.innerHTML = '<b>Você</b><p>'+texto+'</p><div class="actions"><button onclick="curtir('+id+',this)">❤️ Curtir (<span>0</span>)</button><button onclick="this.parentElement.parentElement.remove()">🗑️ Excluir</button></div>';
  document.getElementById('feed').prepend(div);
  document.getElementById('texto').value = '';
}
function curtir(id, btn){
  curtidas[id]++;
  btn.querySelector('span').innerText = curtidas[id];
}
</script>
</body>
</html>
